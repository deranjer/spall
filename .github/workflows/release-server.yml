name: release-server

# Manual release of the Spall server image (ghcr.io/<owner>/spall-server).
# Runs only from main. The image bundles the Windows client, so the client is
# built on Windows first and then copied into the image build context.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, for example 0.1.0. The image is also tagged latest."
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  check-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release runs only from main; this run is on $GITHUB_REF" >&2
            exit 1
          fi
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          if [ "$ok" -lt 1 ]; then
            echo "No successful ci.yml run for $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "Invalid image tag: $VERSION" >&2
            exit 1
          fi

  client:
    needs: check-ref
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Build client
        run: cargo build --release --locked -p sandbox --features client --bin sandbox-client
      - name: Stage client bundle
        shell: bash
        run: |
          mkdir -p staging/assets
          cp target/release/sandbox-client.exe staging/
          cp -r examples/sandbox/assets/audio staging/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: client-bundle
          path: staging
          if-no-files-found: error

  image:
    needs: client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-bundle
          path: docker/client
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spall-server:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/spall-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
