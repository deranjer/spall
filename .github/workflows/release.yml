name: release

# Every merge to main: test, build, tag the next semantic version, publish the
# server image. The tests and the builds run in parallel; the image is pushed
# under its commit tag as soon as the builds finish, and only the tag, the
# version tags and `latest` wait for the tests.
#
# Version bump comes from the commit messages since the last tag (squash-merge
# with a conventional PR title): `feat:` is minor, `fix:` and anything else is
# patch, `type!:` or a `BREAKING CHANGE` footer is major.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  server-bin:
    runs-on: ubuntu-22.04 # glibc 2.35, older than the debian:bookworm runtime image
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server-release
      - run: cargo build --release --locked -p sandbox --bin sandbox-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-bin
          path: target/release/sandbox-server
          retention-days: 1
          if-no-files-found: error

  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client-release
      - run: cargo build --release --locked -p sandbox --features client --bin sandbox-client
      - name: Stage client bundle
        shell: bash
        run: |
          mkdir -p staging/assets
          cp target/release/sandbox-client.exe staging/
          cp -r examples/sandbox/assets/audio staging/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: client-bundle
          path: staging
          retention-days: 1
          if-no-files-found: error

  # Pushes only the commit tag. Nothing that deploys follows this tag.
  image:
    needs: [server-bin, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-bundle
          path: docker/client
      - uses: actions/download-artifact@v4
        with:
          name: server-bin
          path: docker/server-bin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: SERVER_SOURCE=prebuilt
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/spall-server:sha-${{ github.sha }}

  publish:
    needs: [ci, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A registry-side retag: no rebuild, no image data moved.
      - name: Tag the tested image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/spall-server
          VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE:sha-$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: client-bundle
          path: client-bundle
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
          NOTES: ${{ steps.tag.outputs.changelog }}
        run: |
          (cd client-bundle && zip -qr ../spall-client-windows.zip .)
          gh release create "$TAG" spall-client-windows.zip \
            --title "$TAG" --notes "$NOTES" --verify-tag
