[workspace]
members = [
    "crates/spall_core",
    "crates/spall_protocol",
    "crates/spall_voxel",
    "crates/spall_jobs",
    "crates/spall_structure",
    "crates/spall_net",
    "crates/spall_mesh",
    "crates/spall_render",
    "crates/spall_physics",
    "crates/spall_sim",
    "crates/spall_store",
    "crates/spall_server",
    "crates/spall_client",
    "examples/sandbox",
    "examples/poc_local",
    "tools/spall_editor",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/deranjer/spall"

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.5.53", features = ["derive"] }
glam = { version = "0.33.6", features = ["f64"] }
postcard = { version = "1.1.3", features = ["use-std"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rapier3d = "0.35.3"
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
ring = "0.17.14"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
spall_core = { path = "crates/spall_core" }
spall_jobs = { path = "crates/spall_jobs" }
spall_net = { path = "crates/spall_net" }
spall_mesh = { path = "crates/spall_mesh" }
spall_physics = { path = "crates/spall_physics" }
spall_protocol = { path = "crates/spall_protocol" }
spall_render = { path = "crates/spall_render" }
spall_sim = { path = "crates/spall_sim" }
spall_store = { path = "crates/spall_store" }
spall_structure = { path = "crates/spall_structure" }
spall_voxel = { path = "crates/spall_voxel" }
thiserror = "2.0.17"
zstd = "0.13"
tokio = { version = "1.52.3", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
bytemuck = { version = "1.23", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4.0"
wgpu = "=30.0.1"
winit = "0.30.12"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = "=0.36.2"
yakui = { git = "https://github.com/SecondHalfGames/yakui", rev = "d4cba2dabc2a201162ed105cf547ca95a26c44f3" }
yakui-wgpu = { git = "https://github.com/SecondHalfGames/yakui", rev = "d4cba2dabc2a201162ed105cf547ca95a26c44f3" }
yakui-winit = { git = "https://github.com/SecondHalfGames/yakui", rev = "d4cba2dabc2a201162ed105cf547ca95a26c44f3" }
ron = "0.10.1"

[profile.dev]
debug = 1

[profile.release]
debug = 1

# ENG-30 / T23 row 11: quinn-proto 0.11.17 (the latest crates.io release as of
# 2026-09-13) has a real, reproducible bug in `Datagrams::send(drop = true)`'s
# outgoing-buffer eviction loop -- it subtracts an evicted datagram's size
# from `payload_bytes` twice (once inside `DatagramBuffer::pop_front`, once
# again at the call site), so under sustained eviction (a peer not draining
# its outgoing datagrams fast enough, e.g. a bandwidth-shaped connection under
# real per-tick MotionSnapshot traffic) the counter underflows: release builds
# wrap it to a huge value, drain the whole queue, and then panic on
# `.expect("datagrams.outgoing.payload_bytes desynchronized")` while the
# connection's mutex is held -- poisoning it for every other task on that
# connection, and (since quinn's endpoint-level state is shared across every
# connection on one socket) cascading into every other client's connection on
# the same server process. Reproduced running `t23-g4-join-budget` (a shaped
# 1 MiB/s / 100 ms RTT / 2% loss connection carrying G4-scale per-tick
# datagram traffic) -- see docs/reports/G3.md row 11. Fixed upstream, merged
# to the `0.11.x` branch (quinn-rs/quinn#2806, closing quinn-rs/quinn#2805),
# not yet in a released crates.io version. Pinned to that merge commit; drop
# this patch once a quinn-proto release containing the fix ships and `cargo
# update -p quinn-proto` picks it up.
[patch.crates-io]
quinn-proto = { git = "https://github.com/quinn-rs/quinn", rev = "f650e0f213b01ea7bebd60023e5df7df65e5c2bd" }
