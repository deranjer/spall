[workspace]
members = [
    "crates/spall_core",
    "crates/spall_protocol",
    "crates/spall_voxel",
    "crates/spall_jobs",
    "crates/spall_structure",
    "crates/spall_net",
    "crates/spall_physics",
    "crates/spall_sim",
    "crates/spall_server",
    "crates/spall_client",
    "examples/sandbox",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/deranjer/spall"

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.5.53", features = ["derive"] }
glam = { version = "0.33.6", features = ["f64"] }
postcard = { version = "1.1.3", features = ["use-std"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rapier3d = "0.35.3"
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
ring = "0.17.14"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
spall_core = { path = "crates/spall_core" }
spall_jobs = { path = "crates/spall_jobs" }
spall_net = { path = "crates/spall_net" }
spall_physics = { path = "crates/spall_physics" }
spall_protocol = { path = "crates/spall_protocol" }
spall_sim = { path = "crates/spall_sim" }
spall_structure = { path = "crates/spall_structure" }
spall_voxel = { path = "crates/spall_voxel" }
thiserror = "2.0.17"
tokio = { version = "1.52.3", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wgpu = "24.0.5"
winit = "0.30.12"

[profile.dev]
debug = 1

[profile.release]
debug = 1
