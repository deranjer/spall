[package]
name = "spall_physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobins = false

[features]
# Test-scene builders (also used by gates and benches).
fixtures = ["spall_voxel/fixtures"]
# Offline benchmark binaries.
bench = ["fixtures"]

[lints.clippy]
# The feasibility harness has a few functions with many measured knobs.
too_many_arguments = "allow"

[dependencies]
rapier3d.workspace = true
spall_core.workspace = true
spall_voxel.workspace = true
thiserror.workspace = true

[dev-dependencies]
spall_voxel = { workspace = true, features = ["oracle", "fixtures"] }

[[bin]]
name = "collision-bench"
path = "src/bin/collision_bench.rs"
required-features = ["bench"]

[[bin]]
name = "physics-transfer"
path = "src/bin/physics_transfer.rs"
required-features = ["bench"]

