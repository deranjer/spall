[package]
name = "spall_sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints.clippy]
# The commit/transfer path threads many measured authoritative values.
too_many_arguments = "allow"

[dependencies]
glam.workspace = true
rayon.workspace = true
spall_core.workspace = true
spall_ecology.workspace = true
spall_worldgen.workspace = true
spall_jobs.workspace = true
spall_fluid = { path = "../spall_fluid" }
spall_physics.workspace = true
spall_protocol.workspace = true
spall_structure.workspace = true
spall_voxel.workspace = true
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true

# Offline scenario binary only.
serde_json = { workspace = true, optional = true }

[features]
# Pulls in the JSON serialisation used by the offline `sim-scenario` binary.
scenario = ["dep:serde_json", "fixtures"]
# Test-scene builders (also used by gates and benches).
fixtures = ["spall_voxel/fixtures", "spall_physics/fixtures"]
# Offline benchmark binaries.
bench = ["fixtures", "spall_physics/fixtures"]

[dev-dependencies]
spall_sim = { path = ".", features = ["fixtures"] }
glam = { workspace = true }
spall_core = { workspace = true }
spall_physics = { workspace = true }
spall_protocol = { workspace = true }
spall_structure = { workspace = true, features = ["oracle"] }
spall_voxel = { workspace = true, features = ["oracle", "fixtures"] }

[[bin]]
name = "sim-scenario"
path = "src/bin/sim_scenario.rs"
required-features = ["scenario"]

[[bin]]
name = "region-origin-bench"
path = "src/bin/region_origin_bench.rs"
required-features = ["bench"]

