[package]
name = "spall_store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Raw-SQLite corruption helpers (`inject`) used by the persistence crash
# suite. `FaultPlan` itself stays ungated: `Writer` consults it on every write.
fault-injection = []

[dependencies]
blake3.workspace = true
postcard.workspace = true
rusqlite.workspace = true
serde.workspace = true
spall_core.workspace = true
spall_protocol.workspace = true
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
spall_store = { path = ".", features = ["fault-injection"] }
rusqlite.workspace = true
serde_json.workspace = true
spall_core.workspace = true
spall_protocol.workspace = true
