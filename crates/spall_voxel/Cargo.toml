[package]
name = "spall_voxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Exposes the dense reference model so later foundation tasks (T03+) can reuse
# it as a test oracle without copying it.
oracle = []
# Small scene builders shared by tests, benches and gates.
fixtures = []
# Offline region benchmark binary.
bench = ["fixtures"]

[[bin]]
name = "region-bench"
path = "src/bin/region_bench.rs"
required-features = ["bench"]

[dependencies]
blake3.workspace = true
glam.workspace = true
spall_core.workspace = true
thiserror.workspace = true
