[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "sandbox-server"
path = "src/bin/sandbox-server.rs"

[[bin]]
name = "sandbox-client"
path = "src/bin/sandbox-client.rs"
required-features = ["client"]

[[bin]]
name = "sandbox-capture"
path = "src/bin/sandbox-capture.rs"
required-features = ["client"]

[features]
default = []
client = [
    "dep:spall_client",
    "dep:spall_mesh",
    "dep:spall_jobs",
    "dep:spall_render",
    "dep:serde_json",
]

[dependencies]
blake3.workspace = true
clap.workspace = true
ron.workspace = true
postcard.workspace = true
serde.workspace = true
rusqlite.workspace = true
spall_client = { path = "../../crates/spall_client", optional = true }
spall_fluid = { path = "../../crates/spall_fluid" }
spall_core = { path = "../../crates/spall_core" }
spall_mesh = { workspace = true, optional = true }
spall_jobs = { workspace = true, optional = true }
spall_voxel = { workspace = true }
spall_worldgen = { workspace = true }
spall_net = { path = "../../crates/spall_net" }
spall_protocol = { path = "../../crates/spall_protocol" }
spall_render = { workspace = true, optional = true }
spall_server = { path = "../../crates/spall_server" }
spall_store = { path = "../../crates/spall_store" }
spall_sim = { path = "../../crates/spall_sim" }
spall_physics = { workspace = true }
spall_structure = { workspace = true }
glam.workspace = true
serde_json = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
image.workspace = true
wgpu.workspace = true
